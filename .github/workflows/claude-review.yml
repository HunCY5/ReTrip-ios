# develop 대상 PR이 열리면 Claude Code가 한 번 리뷰한다.
# 리뷰 결과는 참고용이며 머지를 막지 않는다.
name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review]
    branches:
      - develop

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            이 PR을 리뷰하고 모든 코멘트는 한국어로 작성해 주세요.
            프로젝트 규칙은 저장소의 CLAUDE.md를 기준으로 합니다.

            중점적으로 볼 것:
            - 버그 가능성과 예외 처리 누락 (네트워크 실패, 옵셔널 처리, 비동기 작업 취소 등)
            - View / ViewModel / Model 레이어 분리와 Protocol 기반 서비스 구조
            - async/await 사용, UI 갱신의 메인 스레드 보장, 클로저 순환 참조
            - Supabase 접근 시 RLS를 전제로 본인 데이터만 다루는지, 키나 민감정보가 노출되지 않는지
            - 매직 넘버, 접근 제어자 누락 등 CLAUDE.md 코드 작성 규칙 위반

            작성 방식:
            - 특정 코드의 문제는 `mcp__github_inline_comment__create_inline_comment`(confirmed: true)로 해당 줄에 남겨 주세요.
            - 전체 요약과 우선순위는 `gh pr comment`로 코멘트 하나에 남겨 주세요.
            - 문제가 없으면 "리뷰 결과 특이사항 없음"이라고 짧게 남겨 주세요.
            - 취향 차이나 포맷팅 지적은 생략해 주세요.
            - PR 브랜치는 현재 작업 디렉터리에 체크아웃되어 있습니다.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
