# GitHub 기본 자동 닫기는 기본 브랜치(main) 머지에만 동작하므로,
# develop에 머지된 PR에 연결된 이슈를 직접 닫는다.
name: Close Linked Issues

on:
  pull_request:
    types: [closed]
    branches:
      - develop

permissions:
  issues: write
  pull-requests: read

jobs:
  close_linked_issues:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues linked to merged PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          # PR 사이드바(Development)에 연결된 이슈
          linked=$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 50) { nodes { number } }
                }
              }
            }' \
            -f owner="${REPO%/*}" -f name="${REPO#*/}" -F number="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number')

          # 본문의 닫기 키워드(close/fix/resolve #N)로 지정한 이슈
          keyword=$(printf '%s' "$PR_BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' || true)

          for number in $(printf '%s\n%s\n' "$linked" "$keyword" | grep -E '^[0-9]+$' | sort -un); do
            info=$(gh api "repos/$REPO/issues/$number" --jq '[.state, (.pull_request != null)] | @tsv') || {
              echo "#$number: 조회 실패, 건너뜀"
              continue
            }
            state=$(cut -f1 <<< "$info")
            is_pull_request=$(cut -f2 <<< "$info")

            if [ "$is_pull_request" = "true" ]; then
              echo "#$number: PR이라 건너뜀"
              continue
            fi
            if [ "$state" != "open" ]; then
              echo "#$number: 이미 닫힌 이슈라 건너뜀"
              continue
            fi

            gh issue close "$number" -R "$REPO" --reason completed \
              --comment "develop에 머지된 PR #$PR_NUMBER 에 연결된 이슈라 자동으로 닫았습니다."
            echo "#$number: 닫음"
          done
