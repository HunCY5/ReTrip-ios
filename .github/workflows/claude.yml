# PR·이슈 코멘트에서 @claude로 호출하면 Claude Code가 답변한다.
# 코드 수정과 커밋은 하지 않고 질문 답변과 추가 리뷰만 한다.
name: Claude Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  respond:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # 셸 명령을 막아 둔 Claude가 PR 변경 내역을 볼 수 있도록 diff를 저장소 밖 임시 폴더에 준비한다.
      - name: Prepare PR diff
        if: github.event.issue.pull_request || github.event.pull_request
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: gh pr diff "$PR_NUMBER" -R "$REPO" > "$RUNNER_TEMP/pr.diff"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --disallowedTools "Edit,Write,NotebookEdit,Bash"
            --add-dir ${{ runner.temp }}
            --append-system-prompt "모든 답변은 한국어로 작성한다. PR에서 호출된 경우 ${{ runner.temp }}/pr.diff 파일이 있으면 먼저 Read로 읽고, 추가·삭제된 줄을 포함한 그 변경 내역을 기준으로 답한다. 코드 수정, 파일 삭제, 커밋은 하지 않고 코멘트로만 피드백한다."
